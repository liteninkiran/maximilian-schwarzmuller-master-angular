<article>
  <h3>
    <div
      [class]="{
        'ticket-open': true,
        'ticket-closed': false,
      }"
    ></div>
    <button (click)="onToggleDetails()">
      <span class="text">{{ ticket().title }}</span>
      <app-chevron-icon [expand]="detailsVisible()"></app-chevron-icon>
    </button>
  </h3>

  @if (detailsVisible()) {
    <p>{{ ticket().request }}</p>

    @if (ticket().status === "open") {
      <p><button>Mark as completed</button></p>
    }
  }
</article>
