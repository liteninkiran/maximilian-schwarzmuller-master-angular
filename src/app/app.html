<app-header />
<main>
  <ul id="users">
    @for (user of users; track user.id) {
      <li><app-user [user]="user" (select)="onSelectUser($event)" /></li>
    }
  </ul>

  @if (name(); as n) {
    <app-tasks [name]="n" />
  } @else {
    <h2 id="fallback">Select a user to see their tasks</h2>
  }
</main>
