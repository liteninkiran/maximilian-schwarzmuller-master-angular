<app-header />
<main>
  <ul id="users">
    @for (user of users; track user.id) {
      <li>
        <app-user
          [user]="user"
          [isSelected]="selectedUser()?.id === user.id"
          (select)="onSelectUser($event)"
        ></app-user>
      </li>
    }
  </ul>

  @if (selectedUser(); as user) {
    <app-tasks [user]="user"></app-tasks>
  } @else {
    <h2 id="fallback">Select a user to see their tasks</h2>
  }
</main>
